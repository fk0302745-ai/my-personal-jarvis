
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Personal JARVIS</title>
<style>
body {
  background:#071426;
  color:#00eaff;
  text-align:center;
  font-family:Arial;
  padding:30px 12px;
}
h1 { font-size:32px; }
.circle {
  width:160px;
  height:160px;
  border:3px solid #00eaff;
  border-radius:50%;
  margin:35px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  box-shadow:0 0 30px #00eaff;
}
button {
  background:#00cfff;
  color:#00101d;
  border:0;
  border-radius:12px;
  padding:15px 24px;
  font-size:17px;
  margin:8px;
}
#status { margin:20px; }
</style>
</head>
<body>

<h1>MY JARVIS</h1>
<p>Personal Voice Assistant</p>

<div class="circle">🤖</div>

<p id="status">System Ready</p>

<button onclick="listen()">🎙️ TALK TO JARVIS</button>
<button onclick="speak('Hello! How can I help you?')">
  🔊 TEST VOICE
</button>

<script>
function speak(message) {
  let voice = new SpeechSynthesisUtterance(message);
  voice.lang = "en-IN";
  speechSynthesis.speak(voice);
}

function listen() {
  const Speech = window.SpeechRecognition ||
                 window.webkitSpeechRecognition;

  if (!Speech) {
    document.getElementById("status").innerText =
      "Speech recognition not supported. Try Chrome.";
    return;
  }

  let recognition = new Speech();
  recognition.lang = "en-IN";
  recognition.onstart = () => {
    document.getElementById("status").innerText =
      "Listening...";
  };

  recognition.onresult = (event) => {
    let command =
      event.results[0][0].transcript.toLowerCase();

    document.getElementById("status").innerText =
      "You: " + command;

    if (command.includes("hello")) {
      speak("Hello! I am Jarvis.");
    }
    else if (command.includes("time")) {
      speak("The time is " +
        new Date().toLocaleTimeString());
    }
    else if (command.includes("date")) {
      speak("Today is " +
        new Date().toDateString());
    }
    else if (command.includes("your name")) {
      speak("My name is Jarvis.");
    }
    else {
      speak("I am still learning. Please try another command.");
    }
  };

  recognition.onerror = () => {
    document.getElementById("status").innerText =
      "Please allow microphone access and try again.";
  };

  recognition.start();
}
</script>

</body>
</html>
